<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>יום הזיכרון 2026</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;900&family=Frank+Ruhl+Libre:wght@400;700;900&display=swap');

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    font-family: 'Heebo', 'Frank Ruhl Libre', sans-serif;
    cursor: none;
  }

  #slideshow {
    width: 100vw; height: 100vh;
    position: relative;
  }

  .slide {
    position: absolute; inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    z-index: 0;
    transition: opacity 0.5s ease;
  }
  .slide.active {
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
  }

  /* ── Background layer with parallax depth ── */
  .slide-bg {
    position: absolute; inset: -30px;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    filter: brightness(0.6) saturate(1.1);
    will-change: transform;
  }

  /* ── Cinematic gradient overlays ── */
  .slide-overlay {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 50% 40%, transparent 30%, rgba(0,0,0,0.3) 100%),
      linear-gradient(180deg, rgba(0,0,0,0.08) 0%, transparent 20%, transparent 80%, rgba(0,0,0,0.25) 100%);
    z-index: 1;
  }

  /* ── Floating particles canvas ── */
  #particles {
    position: fixed; inset: 0;
    z-index: 50;
    pointer-events: none;
    opacity: 0.4;
  }

  /* ── Content card with frosted glass ── */
  .slide-content {
    position: relative;
    z-index: 2;
    width: 88%;
    max-width: 1180px;
    text-align: center;
    padding: 2.8rem 3.2rem;
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 28px;
    backdrop-filter: blur(8px) saturate(1.2);
    -webkit-backdrop-filter: blur(8px) saturate(1.2);
    box-shadow:
      0 8px 32px rgba(0,0,0,0.4),
      inset 0 1px 0 rgba(255,255,255,0.05);
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.4s 0.08s ease, transform 0.4s 0.08s ease;
  }
  .slide.active .slide-content {
    opacity: 1;
    transform: translateY(0);
  }

  .slide-content.no-card {
    background: none;
    border: none;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    box-shadow: none;
  }

  /* ── Title typography ── */
  .slide-title {
    font-family: 'Frank Ruhl Libre', 'Heebo', serif;
    font-weight: 900;
    font-size: clamp(2.2rem, 5vw, 4.5rem);
    color: #fff;
    text-shadow:
      0 0 60px rgba(255,255,255,0.15),
      0 0 40px rgba(0,0,0,0.9),
      0 2px 4px rgba(0,0,0,0.8);
    line-height: 1.5;
    letter-spacing: 0.02em;
  }

  .slide-title.title-slide {
    font-size: clamp(3rem, 7vw, 6rem);
    letter-spacing: 0.06em;
    text-shadow: 0 0 80px rgba(255,255,255,0.15), 0 0 40px rgba(0,0,0,0.9), 0 2px 4px rgba(0,0,0,0.8);
  }

  /* ── Lyrics typography ── */
  .slide-lyrics {
    font-family: 'Heebo', sans-serif;
    font-weight: 700;
    font-size: clamp(1rem, 2.2vw, 1.75rem);
    color: rgba(255,255,255,0.95);
    text-shadow:
      0 0 20px rgba(0,0,0,0.8),
      0 1px 2px rgba(0,0,0,0.6);
    line-height: 2;
    letter-spacing: 0.015em;
    max-height: 82vh;
    overflow-y: auto;
  }
  .slide-lyrics > div {
    transition: opacity 0.3s;
  }

  .slide-lyrics.dense {
    font-size: clamp(0.85rem, 1.7vw, 1.35rem);
    line-height: 1.9;
  }

  .slide-lyrics.two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.2rem 2.5rem;
    text-align: right;
  }

  .slide-lyrics.prayer {
    font-family: 'Frank Ruhl Libre', serif;
    font-weight: 700;
    font-size: clamp(1.1rem, 2.5vw, 2rem);
    line-height: 2.2;
    color: rgba(255,255,255,0.97);
  }

  .col { text-align: center; }

  /* ── Bottom UI ── */
  .slide-number {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.35);
    font-size: 0.8rem;
    font-family: 'Heebo', sans-serif;
    font-weight: 300;
    z-index: 100;
    pointer-events: none;
    direction: ltr;
    unicode-bidi: bidi-override;
    letter-spacing: 0.15em;
  }

  .progress-bar {
    position: fixed;
    bottom: 0; left: 0;
    height: 2px;
    background: linear-gradient(90deg, rgba(255,255,255,0.08), rgba(255,255,255,0.4), rgba(255,255,255,0.08));
    transition: width 0.4s ease;
    z-index: 100;
    box-shadow: 0 0 12px rgba(255,255,255,0.15);
  }

  .nav-hint {
    position: fixed;
    bottom: 3.2rem;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.25);
    font-size: 0.7rem;
    font-family: 'Heebo', sans-serif;
    font-weight: 300;
    z-index: 100;
    pointer-events: none;
    white-space: nowrap;
    letter-spacing: 0.1em;
    animation: hintFade 1s 3s both;
  }

  @keyframes hintFade {
    from { opacity: 0; transform: translateX(-50%) translateY(8px); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  /* ── Vignette frame ── */
  .vignette {
    position: fixed; inset: 0;
    z-index: 60;
    pointer-events: none;
    box-shadow: inset 0 0 120px 30px rgba(0,0,0,0.3);
  }

  ::-webkit-scrollbar { width: 0; }
</style>
</head>

let currentSlide = 0;

// ── Floating particles ──
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let particles = [];

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function createParticles() {
  particles = [];
  const count = Math.floor((canvas.width * canvas.height) / 18000);
  for (let i = 0; i < count; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.8 + 0.3,
      dx: (Math.random() - 0.5) * 0.15,
      dy: -Math.random() * 0.25 - 0.05,
      opacity: Math.random() * 0.5 + 0.1,
      pulse: Math.random() * Math.PI * 2,
      pulseSpeed: Math.random() * 0.008 + 0.003
    });
  }
}
createParticles();

function drawParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (const p of particles) {
    p.x += p.dx;
    p.y += p.dy;
    p.pulse += p.pulseSpeed;
    const o = p.opacity * (0.6 + 0.4 * Math.sin(p.pulse));

    if (p.y < -10) { p.y = canvas.height + 10; p.x = Math.random() * canvas.width; }
    if (p.x < -10) p.x = canvas.width + 10;
    if (p.x > canvas.width + 10) p.x = -10;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${o})`;
    ctx.fill();
  }
  requestAnimationFrame(drawParticles);
}
drawParticles();

// ── Preload all slide images immediately ──
slides.forEach(s => { const img = new Image(); img.src = s.bg; });

// ── Unified breathing + parallax via single rAF (no CSS animation conflicts) ──
let mouseX = 0.5, mouseY = 0.5;
let targetX = 0.5, targetY = 0.5;
let activeBg = null; // cached reference updated on slide change

document.addEventListener('mousemove', e => {
  targetX = e.clientX / window.innerWidth;
  targetY = e.clientY / window.innerHeight;
});

(function animateBg(ts) {
  mouseX += (targetX - mouseX) * 0.06;
  mouseY += (targetY - mouseY) * 0.06;

  const scale = 1.12 + Math.sin(ts * 0.00045) * 0.02;
  const ox = (mouseX - 0.5) * -10;
  const oy = (mouseY - 0.5) * -7;
  // breathe filter driven here so there's no competing CSS animation
  const brightness = 0.6 + Math.sin(ts * 0.00045) * 0.025;
  const saturate  = 1.1 + Math.sin(ts * 0.00045) * 0.025;

  if (activeBg) {
    activeBg.style.transform = `scale(${scale}) translate(${ox}px, ${oy}px)`;
    activeBg.style.filter = `brightness(${brightness}) saturate(${saturate})`;
  }

  requestAnimationFrame(animateBg);
})(0);

// ── Build slides ──
function buildSlides() {
  const container = document.getElementById('slideshow');

  slides.forEach((s, idx) => {
    const div = document.createElement('div');
    div.className = 'slide' + (idx === 0 ? ' active' : '');
    div.dataset.index = idx;

    const bg = document.createElement('div');
    bg.className = 'slide-bg';
    bg.style.backgroundImage = `url('${s.bg}')`;
    div.appendChild(bg);

    const overlay = document.createElement('div');
    overlay.className = 'slide-overlay';
    div.appendChild(overlay);

    const content = document.createElement('div');
    content.className = 'slide-content';

    if (s.type === 'title') {
      content.classList.add('no-card');
      const h = document.createElement('div');
      h.className = 'slide-title title-slide';
      h.textContent = s.lines[0];
      content.appendChild(h);
    } else if (s.type === 'two-col') {
      const lyricsDiv = document.createElement('div');
      lyricsDiv.className = 'slide-lyrics two-col' + (s.dense ? ' dense' : '');

      const c1 = document.createElement('div');
      c1.className = 'col';
      c1.innerHTML = s.col1.map(l => `<div>${l}</div>`).join('');

      const c2 = document.createElement('div');
      c2.className = 'col';
      c2.innerHTML = s.col2.map(l => `<div>${l}</div>`).join('');

      lyricsDiv.appendChild(c1);
      lyricsDiv.appendChild(c2);
      content.appendChild(lyricsDiv);
    } else {
      const cls = s.type === 'prayer' ? 'slide-lyrics prayer' : 'slide-lyrics';
      const lyricsDiv = document.createElement('div');
      lyricsDiv.className = cls + (s.dense ? ' dense' : '');
      lyricsDiv.innerHTML = s.lines.map(l => `<div>${l}</div>`).join('');
      content.appendChild(lyricsDiv);
    }

    div.appendChild(content);
    container.appendChild(div);
  });

  updateIndicator();
}

function goTo(idx) {
  if (idx < 0 || idx >= slides.length) return;
  const allSlides = document.querySelectorAll('.slide');
  const leaving = allSlides[currentSlide];
  // reset the outgoing bg so it doesn't keep a stale inline filter/transform
  const leavingBg = leaving.querySelector('.slide-bg');
  if (leavingBg) { leavingBg.style.transform = ''; leavingBg.style.filter = ''; }
  leaving.classList.remove('active');
  currentSlide = idx;
  allSlides[currentSlide].classList.add('active');
  activeBg = allSlides[currentSlide].querySelector('.slide-bg');
  updateIndicator();
}

function next() { goTo(currentSlide + 1); }
function prev() { goTo(currentSlide - 1); }

function updateIndicator() {
  document.getElementById('slideNum').textContent =
    `${currentSlide + 1} / ${slides.length}`;
  document.getElementById('progress').style.width =
    `${((currentSlide + 1) / slides.length) * 100}%`;
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowDown' || e.key === ' ' || e.key === 'PageDown') {
    e.preventDefault(); next();
  } else if (e.key === 'ArrowRight' || e.key === 'ArrowUp' || e.key === 'PageUp') {
    e.preventDefault(); prev();
  } else if (e.key === 'Home') {
    e.preventDefault(); goTo(0);
  } else if (e.key === 'End') {
    e.preventDefault(); goTo(slides.length - 1);
  } else if (e.key === 'f' || e.key === 'F') {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  }
});

document.addEventListener('click', e => {
  const w = window.innerWidth;
  if (e.clientX < w * 0.35) prev(); else next();
});

let touchStartX = 0;
document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; });
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 50) { if (dx > 0) prev(); else next(); }
});

buildSlides();
// initialise the cached bg reference for slide 0
activeBg = document.querySelector('.slide.active .slide-bg');
</script>
